<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your CIPHER account password.">
    <title>Reset Password | CIPHER</title>
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/themes.css">
</head>
<body>
    <header class="auth-header">
        <a class="brand" href="index.html" aria-label="CIPHER homepage">
            <span class="brand-mark" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span>CIPHER</span>
        </a>
    </header>

    <main class="auth-layout">
        <section class="auth-card">
            <div class="card-heading">
                <span class="eyebrow">ACCOUNT RECOVERY</span>
                <h2>Reset your password</h2>
                <p>Enter your account email and we will send a secure reset link.</p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="forgot-password-email">Email address</label>
                    <input
                        type="email"
                        id="forgot-password-email"
                        autocomplete="email"
                        required
                    >
                </div>
                <div
                    id="forgot-password-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>
                <button
                    type="submit"
                    id="forgot-password-submit"
                    class="primary-button"
                >
                    Send reset link
                </button>
            </form>

            <p class="auth-footer">
                <a href="login.html">Return to login</a>
            </p>
        </section>
    </main>

    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
