<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose a new CIPHER account password.">
    <title>Choose Password | CIPHER</title>
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/themes.css">
</head>
<body>
    <header class="auth-header">
        <a class="brand" href="index.html" aria-label="CIPHER homepage">
            <span class="brand-mark" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span>CIPHER</span>
        </a>
    </header>

    <main class="auth-layout">
        <section class="auth-card">
            <div class="card-heading">
                <span class="eyebrow">ACCOUNT RECOVERY</span>
                <h2>Choose a new password</h2>
                <p>Use at least 10 characters to secure your account.</p>
            </div>

            <form id="update-password-form">
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input
                        type="password"
                        id="new-password"
                        autocomplete="new-password"
                        minlength="10"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm-new-password"
                        autocomplete="new-password"
                        minlength="10"
                        required
                    >
                </div>
                <div
                    id="update-password-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>
                <button
                    type="submit"
                    id="update-password-submit"
                    class="primary-button"
                >
                    Update password
                </button>
            </form>
        </section>
    </main>

    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
