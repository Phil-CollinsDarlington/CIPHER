<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint | CIPHER</title>
    <link rel="stylesheet" href="assets/css/challenge.css">
</head>
<body>
    <main class="challenge-page">
        <article class="challenge-card">
            <span class="challenge-eyebrow">CIPHER CHECKPOINT</span>
            <h1 id="challenge-title">Loading checkpoint...</h1>
            <p id="challenge-message" class="challenge-message">
                Verifying your checkpoint access...
            </p>
            <div id="challenge-clue" class="challenge-clue" hidden></div>
            <form id="answer-form" class="answer-form" hidden>
                <label for="challenge-answer">Your answer</label>
                <input
                    id="challenge-answer"
                    name="answer"
                    autocomplete="off"
                    required
                >
                <button id="answer-submit" class="challenge-button" type="submit">
                    Submit answer
                </button>
            </form>
            <div id="answer-message" class="challenge-message" role="status"
                aria-live="polite"></div>
        </article>
    </main>
    <script type="module" src="assets/js/challenge.js"></script>
</body>
</html>
